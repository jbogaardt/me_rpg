<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #0a0a0f; --card: #15151f; --line: #2a2a3a; --text: #e8e4d8; --dim: #9a968a; --gold: #f0c060; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 Georgia, 'Times New Roman', serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 40px 16px 64px; }
      h1 { margin: 0 0 4px; font-size: 32px; color: var(--gold); letter-spacing: 0.04em; }
      .sub { margin: 0 0 32px; color: var(--dim); }
      .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
      .card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        overflow: hidden; color: inherit; text-decoration: none; transition: transform 0.15s, border-color 0.15s; }
      .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--gold); outline: none; }
      .art { aspect-ratio: 16 / 9; background: linear-gradient(135deg, #20203a, #0e0e18); display: grid; place-items: center;
        font-size: 28px; color: var(--dim); }
      .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .body { padding: 14px 16px 18px; }
      .body h2 { margin: 0 0 6px; font-size: 20px; }
      .body p { margin: 0 0 12px; color: var(--dim); font-size: 14px; }
      .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); color: var(--dim); }
      .badge.playable { color: var(--bg); background: var(--gold); border-color: var(--gold); }
    </style>
  </head>
  <body>
    <main>
      <h1>Games</h1>
      <p class="sub">Pick one to play.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script>
      // Links to the game as it was before the gallery (?campaign=, ?seed=, #join=...) go to the game, keeping everything after the address.
      if (location.search || location.hash) location.replace('me_rpg/' + location.search + location.hash);

      fetch('games.json')
        .then((r) => r.json())
        .then((games) => {
          const grid = document.getElementById('grid');
          for (const g of games) {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = g.slug + '/';
            const art = document.createElement('div');
            art.className = 'art';
            if (g.image) {
              const img = document.createElement('img');
              img.src = g.image;
              img.alt = g.title;
              art.appendChild(img);
            } else art.textContent = g.title;
            const body = document.createElement('div');
            body.className = 'body';
            const h = document.createElement('h2');
            h.textContent = g.title;
            const p = document.createElement('p');
            p.textContent = g.blurb;
            const badge = document.createElement('span');
            badge.className = 'badge ' + g.status;
            badge.textContent = g.status === 'playable' ? 'Play' : 'Coming soon';
            body.append(h, p, badge);
            card.append(art, body);
            grid.appendChild(card);
          }
        })
        .catch(() => {
          document.getElementById('grid').textContent = 'Could not load the games list.';
        });
    </script>
  </body>
</html>
