# The matchmaking relay for 2-player games. Cloudflare deploys it from main (Workers Builds); see relay/README.md.
name = "me-rpg-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Served at https://me-rpg-relay.<account subdomain>.workers.dev. No per-version preview URLs: they would be
# extra public addresses for the same relay.
workers_dev = true
preview_urls = false

[vars]
# Browser origins allowed to call the relay (the deployed game). localhost is always allowed for development.
ALLOWED_ORIGINS = "https://jbogaardt.github.io"

# One Durable Object per game code, plus a per-client request counter for rate limiting.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

# SQLite-backed classes are the ones available on Cloudflare's free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limiter"]
