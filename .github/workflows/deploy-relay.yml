name: Deploy relay (Cloudflare)

# Publishes relay/ to Cloudflare Workers whenever it changes on main (or on demand: Actions > Deploy relay > Run
# workflow). One-time setup is in relay/README.md: it needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets, and does nothing (with a notice) until they exist.

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - 'src/net/roomCode.ts'
      - 'src/net/relayApi.ts'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Relay not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see relay/README.md), then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test the relay before publishing it
        if: steps.creds.outputs.ready == 'true'
        run: |
          npm ci
          npx vitest run tools/relay src/net

      - name: Deploy
        id: wrangler
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy

      - name: Show where the relay lives
        if: steps.creds.outputs.ready == 'true'
        env:
          URL: ${{ steps.wrangler.outputs.deployment-url }}
        run: |
          echo "Relay URL: $URL"
          {
            echo "### Relay deployed"
            echo
            echo "URL: \`$URL\`"
            echo
            echo "Set this as \`DEPLOYED_RELAY_URL\` in \`src/net/relayConfig.ts\` (or tell Claude), then push."
          } >> "$GITHUB_STEP_SUMMARY"
