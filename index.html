<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Me RPG</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; }
      canvas { display: block; touch-action: none; }

      /* On-screen controls (wired up in src/game/touch.ts; shown only on touch devices). */
      #touch-controls {
        position: fixed; inset: 0; pointer-events: none; z-index: 1;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #touch-controls[hidden] { display: none; }
      #dpad, #action-btn {
        position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.35);
      }
      #dpad { left: calc(20px + env(safe-area-inset-left)); width: 140px; height: 140px; }
      #dpad-knob {
        position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
        border-radius: 50%; background: rgba(255, 255, 255, 0.3); pointer-events: none;
      }
      #dpad .arrow {
        position: absolute; color: rgba(255, 255, 255, 0.55); font: 20px/1 sans-serif; pointer-events: none;
      }
      #dpad .up { top: 8px; left: 50%; transform: translateX(-50%); }
      #dpad .down { bottom: 8px; left: 50%; transform: translateX(-50%); }
      #dpad .left { left: 10px; top: 50%; transform: translateY(-50%); }
      #dpad .right { right: 10px; top: 50%; transform: translateY(-50%); }
      #dpad.up .up, #dpad.down .down, #dpad.left .left, #dpad.right .right { color: #ffb13f; }
      #action-btn {
        right: calc(28px + env(safe-area-inset-right)); width: 84px; height: 84px; margin-bottom: 28px;
        color: rgba(255, 255, 255, 0.85); font: bold 30px/80px sans-serif; text-align: center;
      }
      #action-btn.pressed { background: rgba(231, 104, 47, 0.6); border-color: #e7682f; }
    </style>
  </head>
  <body>
    <div id="touch-controls" hidden>
      <div id="dpad">
        <span class="arrow up">▲</span><span class="arrow down">▼</span>
        <span class="arrow left">◀</span><span class="arrow right">▶</span>
        <div id="dpad-knob"></div>
      </div>
      <div id="action-btn">A</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
