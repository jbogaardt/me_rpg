<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Me RPG</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <!-- Overlays over the canvas; styles in src/ui.css. [data-key] elements press that key while held (src/core/touch.ts). -->
    <div id="loading">
      <div class="label">Loading…</div>
      <div class="bar"><div class="fill"></div></div>
    </div>

    <div id="hud">
      <div id="hud-stats" class="panel thin wood">
        <div id="hud-hp" class="bar"><div class="fill"></div><span class="label"></span></div>
        <div id="hud-mp" class="bar mirror"><div class="fill"></div><span class="label"></span></div>
      </div>
      <div id="menu-btn" role="button" aria-label="Menu" data-key="Escape">☰</div>
    </div>

    <div id="touch-controls" hidden>
      <div id="dpad">
        <span class="arrow up"></span><span class="arrow down"></span>
        <span class="arrow left"></span><span class="arrow right"></span>
        <div id="dpad-knob"></div>
      </div>
      <div id="buttons">
        <div id="btn-b" role="button" aria-label="Magic" data-key="KeyK">B</div>
        <div id="btn-a" role="button" aria-label="Attack / talk" data-key="KeyJ">A</div>
      </div>
    </div>

    <div id="dialog" class="panel paper" role="button" aria-label="Next line" data-key="KeyJ" hidden>
      <p id="dialog-text"></p>
      <span class="more" aria-hidden="true"></span>
    </div>

    <div id="menu" hidden>
      <div class="panel wood">
        <header>
          <nav>
            <div role="tab" data-tab="status" class="active">Status</div>
            <div role="tab" data-tab="gear">Gear</div>
            <div role="tab" data-tab="controls">Controls</div>
            <div role="tab" data-tab="online">Online</div>
          </nav>
          <div class="close" role="button" aria-label="Close menu" data-key="Escape">✕</div>
        </header>
        <div class="panel thin paper">
          <section id="menu-status"></section>
          <section id="menu-gear" hidden></section>
          <section id="menu-controls" hidden>
            <table>
              <thead><tr><th></th><th>Keyboard</th><th>Touch</th></tr></thead>
              <tbody>
                <tr><td>Move</td><td>WASD / arrows</td><td>D-pad</td></tr>
                <tr><td>Attack / talk</td><td>Space, J, Enter, E</td><td>A</td></tr>
                <tr><td>Next line</td><td>Space, J, Enter, E</td><td>A or tap the box</td></tr>
                <tr><td>Magic</td><td>K, Q</td><td>B</td></tr>
                <tr><td>Menu</td><td>Esc, I, Tab</td><td>☰</td></tr>
                <tr><td>Menu tabs</td><td>← / →</td><td>Tap</td></tr>
              </tbody>
            </table>
          </section>
          <section id="menu-online" hidden>
            <h2>Multiplayer <small>2-player P2P</small></h2>
            <div id="mp-mode" role="radiogroup" aria-label="Multiplayer mode">
              <button type="button" role="radio" data-mode="off" aria-checked="true">Solo / Off</button>
              <button type="button" role="radio" data-mode="host" aria-checked="false">Host</button>
              <button type="button" role="radio" data-mode="join" aria-checked="false">Join</button>
            </div>
            <p id="mp-status" class="mp-status"><span class="dot"></span><span class="label"></span></p>

            <div id="mp-host" hidden>
              <button type="button" id="mp-gen-host" class="mp-btn panel thin wood">Generate Host Code</button>
              <label for="mp-offer">Host code (send this to your friend)</label>
              <textarea id="mp-offer" readonly rows="4" spellcheck="false" placeholder="Press Generate Host Code"></textarea>
              <div class="mp-row">
                <button type="button" id="mp-copy-offer" class="mp-btn panel thin wood" disabled>Copy Offer Code</button>
                <button type="button" id="mp-copy-link" class="mp-btn panel thin wood" disabled>Copy Join Link</button>
              </div>
              <label for="mp-answer-in">Paste Client Answer Code</label>
              <textarea id="mp-answer-in" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="The code your friend sends back"></textarea>
              <button type="button" id="mp-establish" class="mp-btn panel thin wood" disabled>Establish Connection</button>
            </div>

            <div id="mp-join" hidden>
              <label for="mp-offer-in">Host's offer code or join link</label>
              <textarea id="mp-offer-in" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste the code from the host"></textarea>
              <button type="button" id="mp-gen-answer" class="mp-btn panel thin wood" disabled>Generate Answer</button>
              <label for="mp-answer">Your answer code (send this back to the host)</label>
              <textarea id="mp-answer" readonly rows="4" spellcheck="false" placeholder="Press Generate Answer"></textarea>
              <button type="button" id="mp-copy-answer" class="mp-btn panel thin wood" disabled>Copy Answer Code</button>
            </div>

            <div id="mp-active" hidden>
              <p class="mp-connected"></p>
              <button type="button" id="mp-disconnect" class="mp-btn panel thin wood">Disconnect</button>
            </div>

            <p id="mp-note" role="status"></p>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
